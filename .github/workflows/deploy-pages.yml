name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Use standalone TypeScript configuration
        run: cp tsconfig.github-pages.json tsconfig.json

      - name: Build static portfolio
        run: npm run build

      - name: Verify production entry and assets
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const outputDir = path.resolve("dist");
          const htmlPath = path.join(outputDir, "index.html");

          if (!fs.existsSync(htmlPath)) {
            throw new Error("Vite did not generate dist/index.html");
          }

          const html = fs.readFileSync(htmlPath, "utf8");
          const base = "/my---portfolio/";

          if (
            /src=["'][^"']*\/?src\/main\.tsx["']/.test(html) ||
            /src=["'][^"']*\/?main\.tsx["']/.test(html)
          ) {
            throw new Error("Production HTML still points to a source entry file");
          }

          const refs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)]
            .map((match) => match[1]);

          const jsRef = refs.find(
            (url) => url.startsWith(`${base}assets/`) && url.endsWith(".js")
          );
          const cssRef = refs.find(
            (url) => url.startsWith(`${base}assets/`) && url.endsWith(".css")
          );

          if (!jsRef || !cssRef) {
            throw new Error("Production HTML is missing compiled JS or CSS");
          }

          for (const url of refs) {
            const relativePath = url.startsWith(base)
              ? url.slice(base.length)
              : url.startsWith("./")
                ? url.slice(2)
                : null;

            if (
              relativePath &&
              !fs.existsSync(path.join(outputDir, relativePath))
            ) {
              throw new Error(`Production asset is missing: ${url}`);
            }
          }

          console.log(`Verified compiled production assets under ${base}`);
          NODE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
